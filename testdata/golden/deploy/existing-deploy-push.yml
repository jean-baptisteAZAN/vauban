# Generated by vauban (target: existing)
# Build the image, push it to GHCR and deploy it over SSH.
# App secrets: every repository secret named APP_<NAME> becomes <NAME> in .env.
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_PORT: "8080"
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/acme/widget:latest
            ghcr.io/acme/widget:${{ github.sha }}

      # Runs can finish out of order: only the tip of main is deployed.
      - name: Check this commit is still the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$tip" = "$IMAGE_TAG" ]; then
            printf 'current=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'skipping: %s is no longer the tip of main\n' "$IMAGE_TAG"
            printf 'current=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Write .env from APP_* secrets
        if: steps.tip.outputs.current == 'true'
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          umask 077
          jq -rn 'env.SECRETS_JSON | fromjson | to_entries[]
            | select(.key | startswith("APP_") and length > 4)
            | if (.value | contains("\u0027"))
              then error("secret \(.key) contains a single quote, which .env cannot hold")
              else "\(.key | ltrimstr("APP_"))=\u0027\(.value)\u0027" end' > .env
          chmod 600 .env

      - name: Deploy over SSH
        if: steps.tip.outputs.current == 'true'
        env:
          REPO: ${{ github.repository }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          project='widget'
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key)
          # The host key was pinned by vauban: never trust one learned here.
          (umask 077 && printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts)
          ssh_opts=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)
          # The project directory is created by vauban apply, not by CI, and
          # must belong to this repository (slugs compare case-insensitively).
          ssh "${ssh_opts[@]}" -p "$DEPLOY_PORT" "deploy@$DEPLOY_HOST" "test -d ~/apps/$project" || {
            printf 'remote directory ~/apps/%s is missing: run vauban apply\n' "$project" >&2
            exit 1
          }
          ssh "${ssh_opts[@]}" -p "$DEPLOY_PORT" "deploy@$DEPLOY_HOST" "grep -qixF -e \"$REPO\" ~/apps/$project/.vauban-owner" || {
            printf '~/apps/%s belongs to another repository\n' "$project" >&2
            exit 1
          }
          # scp needs an IPv6 address in brackets.
          scp_host=$DEPLOY_HOST
          case $DEPLOY_HOST in *:*) scp_host="[$DEPLOY_HOST]" ;; esac
          scp "${ssh_opts[@]}" -P "$DEPLOY_PORT" deploy/compose.yaml .env "deploy@$scp_host:apps/$project/"
          # The registry token goes over stdin, never on a command line, into a
          # throwaway docker config removed on exit: it never persists remotely.
          remote=$(printf 'cd ~/apps/%q' "$project")
          remote+=' && chmod 600 .env && DOCKER_CONFIG=$(mktemp -d) && export DOCKER_CONFIG && trap '\''rm -rf "$DOCKER_CONFIG"'\'' EXIT'
          remote+=$(printf ' && docker login ghcr.io -u %q --password-stdin && export APP_PORT=%q IMAGE_TAG=%q && docker compose pull && docker compose up -d --remove-orphans' "$GITHUB_ACTOR" "$APP_PORT" "$IMAGE_TAG")
          printf '%s\n' "$GHCR_TOKEN" | ssh "${ssh_opts[@]}" -p "$DEPLOY_PORT" "deploy@$DEPLOY_HOST" "$remote"
