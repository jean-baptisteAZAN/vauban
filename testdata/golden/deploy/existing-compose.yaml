# Generated by vauban (target: existing)
# APP_PORT and IMAGE_TAG (the commit sha) come from the shell environment of
# `docker compose` (set by the deploy workflow); app secrets from .env.
# The shared Caddy reaches this app as widget-app on the vauban network.
name: vauban-widget

services:
  app:
    image: ghcr.io/acme/widget:${IMAGE_TAG:?IMAGE_TAG must be set}
    restart: unless-stopped
    env_file: .env
    # The app must listen on 0.0.0.0:$PORT.
    environment:
      PORT: "${APP_PORT:?APP_PORT must be set}"
    networks:
      vauban:
        aliases:
          - widget-app

networks:
  vauban:
    external: true
