# Generated by vauban: build the image, push it to GHCR and deploy it over SSH.
# App secrets: every repository secret named APP_<NAME> becomes <NAME> in .env.
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_PORT: "8080"
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/acme/widget:latest
            ghcr.io/acme/widget:${{ github.sha }}

      # Runs can finish out of order: only the tip of main is deployed.
      - name: Check this commit is still the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$tip" = "$IMAGE_TAG" ]; then
            printf 'current=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'skipping: %s is no longer the tip of main\n' "$IMAGE_TAG"
            printf 'current=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Write .env from APP_* secrets
        if: steps.tip.outputs.current == 'true'
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          umask 077
          jq -rn 'env.SECRETS_JSON | fromjson | to_entries[]
            | select(.key | startswith("APP_") and length > 4)
            | if (.value | contains("\u0027"))
              then error("secret \(.key) contains a single quote, which .env cannot hold")
              else "\(.key | ltrimstr("APP_"))=\u0027\(.value)\u0027" end' > .env
          chmod 600 .env

      - name: Deploy over SSH
        if: steps.tip.outputs.current == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key)
          # A fresh server may still be booting: wait for its SSH host key.
          keys=
          for _ in $(seq 30); do
            keys=$(ssh-keyscan -H "$DEPLOY_HOST" 2>/dev/null) && [ -n "$keys" ] && break
            sleep 10
          done
          [ -n "$keys" ] || { printf 'deploy host unreachable over ssh\n' >&2; exit 1; }
          printf '%s\n' "$keys" >> ~/.ssh/known_hosts
          ssh_opts=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)
          # Wait for first-boot setup (Docker, ~/app) to finish.
          ssh "${ssh_opts[@]}" "deploy@$DEPLOY_HOST" 'cloud-init status --wait >/dev/null 2>&1; mkdir -p ~/app'
          scp "${ssh_opts[@]}" deploy/compose.yaml deploy/Caddyfile .env "deploy@$DEPLOY_HOST:~/app/"
          # The registry token goes over stdin, never on a command line, into a
          # throwaway docker config removed on exit: it never persists remotely.
          remote='cd ~/app && chmod 600 .env && DOCKER_CONFIG=$(mktemp -d) && export DOCKER_CONFIG && trap '\''rm -rf "$DOCKER_CONFIG"'\'' EXIT'
          remote+=$(printf ' && docker login ghcr.io -u %q --password-stdin && export DOMAIN=%q APP_PORT=%q IMAGE_TAG=%q && docker compose pull && docker compose up -d --remove-orphans' "$GITHUB_ACTOR" "$DEPLOY_DOMAIN" "$APP_PORT" "$IMAGE_TAG")
          printf '%s\n' "$GHCR_TOKEN" | ssh "${ssh_opts[@]}" "deploy@$DEPLOY_HOST" "$remote"
