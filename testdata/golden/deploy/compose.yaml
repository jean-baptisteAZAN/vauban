# Generated by vauban. DOMAIN and APP_PORT come from the shell environment of
# `docker compose up` (set by the deploy workflow); app secrets from .env.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
      APP_PORT: ${APP_PORT:?APP_PORT must be set}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    image: ghcr.io/acme/widget:latest
    restart: unless-stopped
    env_file: .env

volumes:
  caddy_data:
  caddy_config:
