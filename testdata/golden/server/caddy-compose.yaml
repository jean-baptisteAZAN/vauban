# Managed by vauban. Do not edit: vauban refuses to overwrite a changed file.
services:
  caddy:
    image: caddy:2
    container_name: vauban-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - vauban

volumes:
  caddy_data:
  caddy_config:

networks:
  vauban:
    external: true
