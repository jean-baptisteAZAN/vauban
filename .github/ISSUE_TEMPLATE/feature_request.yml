name: Feature request
description: Suggest an idea, a new cloud or a new stack.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like vauban to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other tools that do this.
  - type: checkboxes
    id: fit
    attributes:
      label: Fit
      options:
        - label: This keeps vauban "set up once, never think about it again" and delegates to official tools where they exist.
