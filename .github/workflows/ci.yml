name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Draft PRs don't run CI: open PRs as drafts while iterating and mark them
    # "Ready for review" when done. Pushes to a ready PR still run (required checks).
    types: [opened, reopened, synchronize, ready_for_review]

# A new push to the same PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  lint:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  build:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - name: go.mod and go.sum are tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
