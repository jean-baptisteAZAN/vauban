# Generated by vauban (target: existing)
# APP_PORT and IMAGE_TAG (the commit sha) come from the shell environment of
# `docker compose` (set by the deploy workflow); app secrets from .env.
# The shared Caddy reaches this app as <% .Project %>-app on the vauban network.
name: <% .Project %>

services:
  app:
    image: <% .Image %>:${IMAGE_TAG:?IMAGE_TAG must be set}
    restart: unless-stopped
    env_file: .env
    # The app must listen on 0.0.0.0:$PORT.
    environment:
      PORT: "${APP_PORT:?APP_PORT must be set}"
    networks:
      vauban:
        aliases:
          - <% .Project %>-app

networks:
  vauban:
    external: true
