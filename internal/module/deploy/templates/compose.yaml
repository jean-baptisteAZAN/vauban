# Generated by vauban. DOMAIN, APP_PORT and IMAGE_TAG (the commit sha) come
# from the shell environment of `docker compose` (set by the deploy workflow);
# app secrets from .env.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
      APP_PORT: ${APP_PORT:?APP_PORT must be set}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    image: <% .Image %>:${IMAGE_TAG:?IMAGE_TAG must be set}
    restart: unless-stopped
    env_file: .env
    # The app must listen on 0.0.0.0:$PORT.
    environment:
      PORT: "${APP_PORT}"

volumes:
  caddy_data:
  caddy_config:
