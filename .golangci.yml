version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
  settings:
    staticcheck:
      checks: ["all", "-QF1001", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
    errcheck:
      # Writes to the terminal are best-effort.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
        - os.Remove
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
      # Scaleway still returns MonthlyPrice; it is the only price field we have.
      - path: internal/cloud/scaleway\.go
        text: "SA1019"

formatters:
  enable:
    - gofmt
